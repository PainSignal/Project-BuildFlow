services:
  mysql:
    image: mysql:8.0
    container_name: buildflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: buildflow_root_password
      MYSQL_DATABASE: buildflow
      MYSQL_USER: buildflow
      MYSQL_PASSWORD: buildflow_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s

volumes:
  mysql_data:
